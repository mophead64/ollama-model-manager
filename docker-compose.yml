services:
  ollama-model-manager:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Ollama running on the Docker host. If Ollama is another service in this
      # compose file, use its service name instead, e.g. http://ollama:11434.
      OLLAMA_HOST: http://host.docker.internal:11434
      # Set to false to hide the Delete buttons and refuse deletions.
      # ALLOW_MODEL_DELETE: "false"
    volumes:
      # The app's SQLite database (login details and sessions).
      - omm-data:/data
      # Ollama's model folder, read-only, so the dashboard can show free disk
      # space where models are stored. Point it at wherever yours lives:
      #   macOS / Linux user install: ${HOME}/.ollama/models
      #   Linux service install:      /usr/share/ollama/.ollama/models
      #   Ollama in Docker:           the volume mounted at /root/.ollama in that container
      - ${HOME}/.ollama/models:/models:ro
    # Docker Desktop, Rancher Desktop, OrbStack etc. resolve host.docker.internal
    # to the host machine out of the box. Native Docker Engine on Linux doesn't,
    # so uncomment this there (and have Ollama listen on more than 127.0.0.1,
    # e.g. OLLAMA_HOST=0.0.0.0 in the ollama service's environment). Don't set it
    # on a Mac: host-gateway points at the Docker VM, not the Mac.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # GPU stats on the System page. CPU and memory work everywhere. AMD (and
    # Intel) GPUs are read from /sys with no extra setup. NVIDIA GPUs need the
    # NVIDIA Container Toolkit on the host and this block, which mounts
    # nvidia-smi into the container. Docker on a Mac can't see the GPU at all:
    # run the binary natively there to get Apple silicon stats.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [utility]
volumes:
  omm-data:
