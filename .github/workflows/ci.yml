name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: Cross-compile the release targets
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "$t"
            CGO_ENABLED=0 GOOS="${t%/*}" GOARCH="${t#*/}" go build -trimpath -o /dev/null ./cmd/ollama-model-manager
          done

  release:
    name: Build, containerise & release
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Serialised so two pushes landing close together can't compute the same
    # "next tag for today" and race each other.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write      # create the vYYYY.MM.DD tag + GitHub release
      packages: write      # push the image to GHCR
      id-token: write      # sign the build provenance attestations
      attestations: write  # store them
    env:
      IMAGE: ghcr.io/mophead64/ollama-model-manager
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release tag
        id: tag
        run: |
          date="$(date -u +%Y.%m.%d)"
          base="v${date}"
          if ! git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            tag="$base"
          else
            n=1
            while git rev-parse -q --verify "refs/tags/${base}.${n}" >/dev/null; do
              n=$((n + 1))
            done
            tag="${base}.${n}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (image tag ${tag#v})"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Standalone binaries for Linux, macOS and Windows (amd64 and arm64).
      # They aren't code-signed yet: Windows SmartScreen and macOS Gatekeeper
      # warn about them (the release notes say how to run them anyway).
      # Signing slots in here, before packaging, once there's a certificate:
      # sign the .exe files (e.g. via SignPath, Azure Artifact Signing or a
      # CA's cloud signing action) and codesign + notarise the macOS ones
      # with a Developer ID; package.sh would then archive the signed files.
      - name: Build and package binaries
        run: scripts/package.sh "${{ steps.tag.outputs.tag }}" dist/release

      # Build provenance: lets anyone check a download was built from this
      # repo by this workflow (gh attestation verify <file> -R <owner>/<repo>).
      # Not a substitute for code signing as far as Windows/macOS go.
      - name: Attest binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures, without emulation: the Dockerfile cross-compiles.
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ steps.tag.outputs.tag }}" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body > body.md
          {
            echo
            echo "## Install"
            echo
            echo "**Docker** (linux/amd64, linux/arm64): \`docker pull ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}\`"
            echo
            echo "**Standalone binary:** download the archive for your system below, extract it and run \`ollama-model-manager\`"
            echo "(\`ollama-model-manager.exe\` on Windows). Its database, \`omm.db\`, is created next to the binary; set \`DB_PATH\` to keep it elsewhere."
            echo
            echo "The binaries aren't code-signed yet:"
            echo "- **Windows:** SmartScreen may say it protected your PC. Choose *More info* → *Run anyway*."
            echo "- **macOS:** Gatekeeper blocks it on first run. Run \`xattr -d com.apple.quarantine ollama-model-manager\` in the extracted folder, or allow it under System Settings → Privacy & Security."
            echo
            echo "Check a download against \`SHA256SUMS\`, or its provenance with \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."
          } >> body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes-file body.md \
            dist/release/*
